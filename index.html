<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Claremorris Community Radio — 94.6FM</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./css/normalize.css" />
		<link rel="stylesheet" href="./css/style.css" />
	</head>
	<body>
		<header class="header">
			<div class="container">
				<div class="header__inner">
					<div class="logo">
						<span class="logo__mark">CCR</span>
						<span class="logo__freq">94.6 FM</span>
					</div>
					<nav class="nav">
						<a class="nav__link" href="#news">News</a>
						<a class="nav__link" href="#shows">Shows</a>
						<a class="nav__link" href="#schedule">Schedule</a>
						<a class="nav__link" href="#about">About</a>
					</nav>
				</div>
			</div>
		</header>

		<section class="hero">
			<div class="container">
				<div class="hero__inner">
					<span class="hero__eyebrow">Broadcasting from Claremorris, Co. Mayo</span>
					<h1 class="hero__header">
						Claremorris Community Radio
						<span>Local voices, local stories — on air every day.</span>
					</h1>
					<button class="listen-live">
						<span class="listen-live__play"></span>
						Listen Live
						<span class="listen-live__dot"></span>
					</button>

					<div class="now-playing">
						<div class="now-playing__label">Now Playing</div>
						<hr />
						<div class="now-playing__track"><span class="now-playing__artist">The Saw Doctors —</span> N17</div>
					</div>
				</div>
			</div>
		</section>
	</body>
</html>
